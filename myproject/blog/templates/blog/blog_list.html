<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
</head>
<body>
    {% if blogs %}
    {% for blog in blogs %}
    <p> {{blog.title}}</p>
    <p> {{blog.content}}</p>
    <p> {{blog.image}}</p>
    <p> {{blog.created_at}}</p>
    <p> {{blog.is_published}}</p>
    <p> {{blog.views_count}}</p>
    {% endfor %}
    {% else %}
    <p>Статей пока нет</p>
    {% endif %}
</body>
</html>
